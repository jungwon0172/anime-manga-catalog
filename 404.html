<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 | 오늘의 명작</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#eeece1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#eeece1;--ink:#1c1a17;--ink-soft:#4a463e;--indigo:#2d3a63;--vermilion:#b23c2f;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:'Noto Serif KR',serif;text-align:center;padding:24px;box-sizing:border-box;}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--vermilion);}
  h1{font-family:'Black Han Sans',sans-serif;font-size:34px;color:var(--indigo);margin:8px 0 10px;}
  p{font-size:14.5px;line-height:1.8;color:var(--ink-soft);margin:0 0 22px;}
  a.btn{display:inline-block;padding:10px 22px;border:1.5px solid var(--indigo);border-radius:22px;color:var(--indigo);text-decoration:none;font-weight:600;font-size:14px;}
  a.btn:hover{background:var(--indigo);color:#fff;}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.<br>홈에서 애니·만화 추천 목록을 둘러보세요.</p>
    <a class="btn" href="/">오늘의 명작 홈으로</a>
  </main>
</body>
</html>
